.card{width:100%;background:#fff;border-radius:18px;padding:34px 32px;box-shadow:0 24px 60px rgba(0,0,0,.30)}
.card h2{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 6px}
.card .sub{font-size:14px;color:var(--ink2);margin:0 0 22px;line-height:1.55}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.btn:hover{background:#1d4fd7}.btn:disabled{opacity:.6}
.msg{display:none;font-size:13px;padding:11px 14px;border-radius:11px;margin-bottom:15px;line-height:1.45}
.msg.err{display:block;background:#fdecec;border:1px solid #f4c7c7;color:#a02b2b}
.msg.ok{display:block;background:var(--okbg);border:1px solid #b7e4ca;color:var(--ok)}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--blue);text-decoration:none}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="col">
  <div class="dzp-logo-white" role="img" aria-label="Deutsche Zukunftspartner"></div>
  <form class="card" id="form">
    <h2>Neues Passwort vergeben</h2>
    <p class="sub">Wähle ein neues Passwort für deinen Akademie-Zugang.</p>
    <div class="msg" id="msg"></div>
    <div class="field"><label for="pw">Neues Passwort</label><input id="pw" type="password" placeholder="mind. 6 Zeichen" autocomplete="new-password"></div>
    <div class="field"><label for="pw2">Passwort wiederholen</label><input id="pw2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password"></div>
    <button class="btn" type="submit" id="submit">Passwort speichern</button>
    <a class="back" href="akademie-login.html">← Zurück zur Anmeldung</a>
  </form>
</div>
<script src="dzp-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const S=id=>document.getElementById(id), msgEl=S('msg'), btn=S('submit');
function show(k,t){msgEl.className='msg '+k;msgEl.textContent=t;}
let recoveryReady=false;
const c=window.dzpClient();
if(c){ c.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY') recoveryReady=true; }); }
if(!c && !window.dzpConfigured()){ show('err','Vorschaumodus: Supabase ist noch nicht in dzp-config.js eingetragen.'); }
S('form').addEventListener('submit', async function(e){
  e.preventDefault();
  const pw=S('pw').value, pw2=S('pw2').value;
  if(!pw||pw.length<6){ show('err','Bitte ein Passwort mit mindestens 6 Zeichen wählen.'); return; }
  if(pw!==pw2){ show('err','Die beiden Passwörter stimmen nicht überein.'); return; }
  if(!c){ show('err','Login-System nicht verbunden — bitte Supabase in dzp-config.js eintragen.'); return; }
  btn.disabled=true; btn.textContent='Speichern …';
  try{
    const {error}=await c.auth.updateUser({password:pw});
    if(error){ btn.disabled=false; btn.textContent='Passwort speichern'; show('err', error.message.includes('session')||error.message.includes('Auth')?'Der Link ist abgelaufen oder ungültig. Fordere über „Passwort vergessen" einen neuen an.':error.message); return; }
    show('ok','Passwort geändert. Du kannst dich jetzt anmelden.');
    btn.textContent='Erledigt ✓';
  }catch(e){ btn.disabled=false; btn.textContent='Passwort speichern'; show('err','Verbindung fehlgeschlagen. Bitte später erneut versuchen.'); }
});
</script>
</body>
